name: Deploy to WordPress.org
on:
  push:
    tags:
      - "*"
jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - name: Install composer requirements
        run: composer install --prefer-dist --no-progress
      - name: Install php-scoper
        run: composer --working-dir=php-scoper install
      - name: Generate vendor-prefixed
        run: php-scoper/vendor/bin/php-scoper add-prefix --output-dir=./vendor-prefixed --force --quiet
      - name: Copy remaining vendor to vendor-prefixed
        run: |
          cp -R vendor/* vendor-prefixed/
      - name: Dump autoload
        run: composer dump-autoload
      - name: Run PHPUnit tests
        run: composer test
  build:
    name: On push tag
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - name: Install composer requirements
        run: composer install --no-dev --prefer-dist --no-progress
      - name: Prefix dependencies
        run: composer prefix-dependencies
      - name: WordPress plugin deploy
        uses: 10up/action-wordpress-plugin-deploy@stable
        with:
          generate-zip: true
        env:
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SLUG: recrawler
